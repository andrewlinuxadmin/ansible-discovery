check_rhel8_latest = Verify that the latest RHEL 8 version is installed.
jboss43_incompatible = JBoss EAP 4.3 is incompatible with RHEL 8. Migration to JBoss EAP 7.4+ required.
jboss6_eol = JBoss EAP 6.x is EOL and not supported on RHEL 8. Migration to JBoss EAP 7.4+ required.
jboss70_upgrade = JBoss EAP 7.0 requires upgrade to 7.4+ for RHEL 8 support.
php56_unsupported = PHP 5.6 is not supported on RHEL 8. Migration to PHP 7.2+ required.
memcached_upgrade = Memcached 1.4 requires upgrade. RHEL 8 provides Memcached 1.5+.
convert2rhel_direct = Can use convert2rhel to convert directly to RHEL 8.
