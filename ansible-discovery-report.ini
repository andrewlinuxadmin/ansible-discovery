# ──────────────────────────────────────────────────────────────────
# Discovery Report Configuration
# Change the values below to customize colors, labels, and language.
# To generate in another language, duplicate this file (e.g. report-pt.ini)
# and translate the values.
# ──────────────────────────────────────────────────────────────────

[general]
input_file = export.json
output_file = ansible-discovery-report.html
lang = en
locale_sort = en
report_date = March 2026

[colors]
# Primary color (dark grey) — headers, titles, tables
primary = #4a4a4a
# Secondary color — h3, h4 titles
secondary = #555555
# Sidebar
sidebar_bg = #2c2c2c
sidebar_active_bg = #444444
sidebar_active_border = #aaaaaa
# Badges
badge_green_bg = #e8f5e9
badge_green_fg = #2e7d32
badge_yellow_bg = #fff8e1
badge_yellow_fg = #f57f17
badge_red_bg = #ffebee
badge_red_fg = #CC0000
badge_blue_bg = #e3f2fd
badge_blue_fg = #1565c0
badge_grey_bg = #f5f5f5
badge_grey_fg = #616161
# Eligibility status
eligible_color = #2e7d32
not_eligible_color = #CC0000
caveats_color = #f57f17
# Blocker (blocker item color)
blocker_color = #c62828
warning_color = #f57f17
# Table hover
table_hover_bg = #f5f5f5
# Sortable hover
sortable_hover_bg = #3a3a3a

[report]
title = Discovery Report
customer = CUSTOMER NAME
subtitle = Environment Overview
collection_date_label = Collection date
total_vms_label = Total VMs analyzed
html_title = Discovery Report

